# Application Info
spring.application.name=CareSync-HMS
server.port=3000

# =============================================
# MySQL Database (XAMPP MariaDB)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/caresync_hms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Secret (Change this in production!)
jwt.secret=ThisIsAVerySecretKeyForCareSync2024ChangeInProductionMustBe256BitsLong!!
jwt.expiration=86400000

# CORS Configuration (Frontend URLs)
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost,http://127.0.0.1:8000,http://localhost:8000,http://127.0.0.1:5500,http://localhost:5500

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.caresync.hms=DEBUG

# Mail Configuration (Mock for demo)
spring.mail.host=${CARESYNC_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${CARESYNC_MAIL_PORT:2525}
spring.mail.username=${CARESYNC_MAIL_USERNAME:demo}
spring.mail.password=${CARESYNC_MAIL_PASSWORD:demo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
