<!doctype html>
<html lang="en">
  <head>
    <style>#root { display: contents; }</style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareSync HMS — Doctor Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="/legacy/css/dashboard-style.css" />
    <style>

      .material-symbols-outlined {
        vertical-align: middle;
        line-height: 1;
      }
      .nav-icon {
        font-size: 18px !important;
        width: 20px;
        text-align: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .profile-header {
        background: var(--white);
        padding: 30px;
        border-radius: 16px;
        margin-bottom: 24px;
        display: flex;
        gap: 24px;
        align-items: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      }
      .profile-avatar {
        width: 80px;
        height: 80px;
        background: var(--teal);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 700;
        color: var(--white);
      }
      .profile-info h2 {
        font-family: "Sora", sans-serif;
        color: var(--navy);
        margin-bottom: 8px;
      }
      .profile-info p {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 4px;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 24px;
        margin-bottom: 24px;
      }
      .stat-card {
        background: var(--white);
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        display: flex;
        flex-direction: column;
        gap: 12px;
        border-left: 4px solid var(--teal);
      }
      .stat-title {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
      }
      .stat-value {
        font-family: "Sora", sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: var(--navy);
      }

      .table-container {
        background: var(--white);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        margin-bottom: 24px;
      }
      .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .table-title {
        font-family: "Sora", sans-serif;
        font-size: 16px;
        font-weight: 700;
        color: var(--navy);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th,
      td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      th {
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge.confirmed {
        background: var(--teal-light);
        color: var(--teal);
      }
      .badge.pending {
        background: #fef6e9;
        color: var(--warning);
      }
      .badge.cancelled {
        background: #fceeee;
        color: var(--danger);
      }
      .badge.active {
        background: var(--teal-light);
        color: var(--teal);
      }
      .badge.admitted {
        background: #fef6e9;
        color: var(--warning);
      }
      .badge.critical {
        background: #fceeee;
        color: var(--danger);
      }
      .badge.discharged {
        background: #eef1f6;
        color: var(--muted);
      }

      /* Premium Glassmorphism Modal Styles */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(13, 27, 42, 0.4);
        z-index: 200;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        padding: 20px;
        animation: fadeIn 0.25s ease-out;
      }
      .modal-overlay.show {
        display: flex;
      }
      .modal {
        background: var(--white);
        border-radius: 20px;
        width: 100%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        border: 1px solid var(--border);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        animation: slideUp 0.3s ease-out;
      }
      [data-theme="dark"] .modal {
        background: #111b27;
        border-color: rgba(255, 255, 255, 0.08);
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
      }
      .modal-title {
        font-family: "Sora", sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: var(--navy);
      }
      .modal-close {
        background: var(--bg);
        border: none;
        border-radius: 7px;
        width: 32px;
        height: 32px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--slate);
      }
      .modal-body {
        padding: 24px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }
      .form-group label {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .form-group input,
      .form-group select,
      .form-group textarea {
        padding: 10px 13px;
        border: 1.5px solid var(--border);
        border-radius: 9px;
        font-family: "DM Sans", sans-serif;
        font-size: 13.5px;
        color: var(--navy);
        outline: none;
        background: var(--white);
        transition: border-color 0.18s;
      }
      [data-theme="dark"] .form-group input,
      [data-theme="dark"] .form-group select,
      [data-theme="dark"] .form-group textarea {
        color: #fff;
      }
      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        border-color: var(--teal);
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
    
</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/doctor-dashboard/main.jsx"></script>
  </body>
</html>
