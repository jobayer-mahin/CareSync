<!doctype html>
<html lang="en">
  <head>
    <style>#root { display: contents; }</style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareSync HMS — Doctor Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>

      .material-symbols-outlined {
        vertical-align: middle;
        line-height: 1;
      }
      .nav-icon {
        font-size: 18px !important;
        width: 20px;
        text-align: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      /* Skeleton styles */
      .skeleton {
        background: #e2e8f0;
        background-image: linear-gradient(
          90deg,
          #e2e8f0 0px,
          #cbd5e1 40px,
          #e2e8f0 80px
        );
        background-size: 200% 100%;
        animation: skeleton-pulse 1.5s infinite linear;
        border-radius: 4px;
        color: transparent !important;
      }
      .skeleton * {
        visibility: hidden;
      }
      @keyframes skeleton-pulse {
        0% {
          background-position: -100% 0;
        }
        100% {
          background-position: 100% 0;
        }
      }
    
</style>
    <link rel="stylesheet" href="/legacy/css/dashboard-style.css" />
    <link rel="stylesheet" href="/legacy/css/doctor-style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/doctor-management/main.jsx"></script>
  </body>
</html>
