<!doctype html>
<html lang="en">
  <head>
    <style>#root { display: contents; }</style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareSync HMS — Patient Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/legacy/css/dashboard-style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>

      .material-symbols-outlined {
        vertical-align: middle;
        line-height: 1;
      }
      .nav-icon {
        font-size: 18px !important;
        width: 20px;
        text-align: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .profile-header {
        background: var(--white);
        padding: 30px;
        border-radius: 16px;
        margin-bottom: 24px;
        display: flex;
        gap: 24px;
        align-items: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      }
      .profile-avatar {
        width: 80px;
        height: 80px;
        background: var(--teal-light);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 700;
        color: var(--white);
      }
      .profile-info h2 {
        font-family: "Sora", sans-serif;
        color: var(--navy);
        margin-bottom: 8px;
      }
      .profile-info p {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 4px;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 24px;
        margin-bottom: 24px;
      }
      .stat-card {
        background: var(--white);
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .stat-title {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
      }
      .stat-value {
        font-family: "Sora", sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: var(--navy);
      }
      .stat-sub {
        font-size: 13px;
        color: var(--teal);
        font-weight: 500;
      }
      .stat-sub.danger {
        color: var(--danger);
      }

      .table-container {
        background: var(--white);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        margin-bottom: 24px;
      }
      .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .table-title {
        font-family: "Sora", sans-serif;
        font-size: 16px;
        font-weight: 700;
        color: var(--navy);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th,
      td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      th {
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge.confirmed {
        background: var(--teal-light);
        color: var(--teal);
      }
      .badge.pending {
        background: #fef6e9;
        color: var(--warning);
      }
      .badge.unpaid {
        background: #fceeee;
        color: var(--danger);
      }

      /* AI Symptom Checker Beautification */
      .ai-banner {
        background: linear-gradient(135deg, #7c5cbf 0%, #6366f1 50%, #4f46e5 100%);
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 24px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }
      .ai-banner:hover {
        transform: translateY(-4px) scale(1.01);
        box-shadow: 0 15px 35px rgba(99, 102, 241, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      .ai-banner::before {
        content: "";
        position: absolute;
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
        top: -50px;
        right: -30px;
        pointer-events: none;
      }
      .ai-banner-icon-glow {
        animation: float-slow 4s ease-in-out infinite;
      }
      @keyframes float-slow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      /* Modal overlay + shell (this page previously had no .modal-overlay/.modal
         rules at all, so the AI Symptom Checker dialog never displayed as a
         popup — it just sat inline, unstyled, in the page). */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(13, 27, 42, 0.55);
        z-index: 200;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(3px);
        padding: 20px;
      }
      .modal-overlay.show {
        display: flex;
      }
      .modal {
        background: #fff;
        border-radius: 16px;
        width: 100%;
        max-height: 90vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      .modal-body {
        flex: 1 1 auto;
        overflow-y: auto;
        min-height: 0;
      }
      .modal-title {
        font-family: "Sora", sans-serif;
        font-size: 17px;
        font-weight: 700;
        color: var(--navy);
      }
      .modal-close {
        background: transparent;
        border: none;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        color: var(--muted);
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Premium Glassmorphism Modal */
      #aiModal .modal {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        border-radius: 20px;
        overflow: hidden;
        transition: all 0.3s ease;
      }
      [data-theme="dark"] #aiModal .modal {
        background: rgba(17, 27, 39, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }
      
      .ai-input-wrapper {
        position: relative;
        margin-bottom: 20px;
      }
      .ai-textarea {
        width: 100%;
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        font-family: "DM Sans", sans-serif;
        font-size: 14px;
        color: var(--navy);
        outline: none;
        resize: none;
        transition: all 0.25s ease;
      }
      .ai-textarea:focus {
        border-color: #8b5cf6;
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        background: var(--white);
      }
      .ai-btn-glow {
        background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        border: none;
        color: white;
        font-family: "Sora", sans-serif;
        font-weight: 600;
        font-size: 14px;
        padding: 14px 28px;
        border-radius: 12px;
        cursor: pointer;
        width: 100%;
        transition: all 0.25s ease;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .ai-btn-glow:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        background: linear-gradient(135deg, #7c5cbf 0%, #4f46e5 100%);
      }
      .ai-btn-glow:active {
        transform: translateY(0);
      }

      /* Result panel styling. React only mounts this element when there is
         something to show (aiPhase !== "idle"), so it must NOT default to
         display:none here — that rule was left over from a vanilla-JS
         version that toggled display via script, and it silently hid the
         loading spinner and the results in the React rewrite. */
      .ai-result-panel {
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.05) 0%, rgba(99, 102, 241, 0.05) 100%);
        border: 1.5px solid rgba(139, 92, 246, 0.15);
        border-radius: 16px;
        padding: 20px;
        margin-top: 20px;
        animation: fadeIn 0.4s ease forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .ai-dept-title {
        font-family: "Sora", sans-serif;
        font-size: 20px;
        font-weight: 700;
        background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      
      /* Pulse ring loading animation */
      .ai-loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 10px;
        gap: 16px;
      }
      .ai-pulse-ring {
        width: 60px;
        height: 60px;
        border: 3px solid rgba(139, 92, 246, 0.1);
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ai-pulse-ring::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border: 3px solid #8b5cf6;
        border-radius: 50%;
        animation: ring-pulse 1.5s infinite ease-out;
      }
      @keyframes ring-pulse {
        0% { transform: scale(0.6); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 0; }
      }
      @keyframes rotate {
        100% { transform: rotate(360deg); }
      }
    
</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/patient-dashboard/main.jsx"></script>
  </body>
</html>
