<!doctype html>
<html lang="en">
  <head>
    <style>#root { display: contents; }</style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareSync HMS — My Patients</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/legacy/css/dashboard-style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>

      .material-symbols-outlined {
        vertical-align: middle;
        line-height: 1;
      }
      .nav-icon {
        font-size: 18px !important;
        width: 20px;
        text-align: center;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .patients-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 16px;
      }
      .header-left h2 {
        font-family: "Sora", sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: var(--navy);
        margin-bottom: 4px;
      }
      .header-left p {
        font-size: 13px;
        color: var(--muted);
      }

      .filter-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .search-input {
        display: flex;
        align-items: center;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        gap: 8px;
        flex: 1;
        max-width: 320px;
      }
      .search-input input {
        border: none;
        background: transparent;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        color: var(--navy);
        outline: none;
        width: 100%;
      }
      .status-select {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        color: var(--slate);
        outline: none;
        cursor: pointer;
      }

      .patient-count-bar {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
      }
      .pc-item {
        background: var(--white);
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 16px 22px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .pc-num {
        font-family: "Sora", sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--navy);
      }
      .pc-label {
        font-size: 12px;
        color: var(--muted);
      }

      .patients-table-wrap {
        background: var(--white);
        border-radius: 14px;
        border: 1px solid var(--border);
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        padding: 13px 20px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        text-align: left;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 16px 20px;
        font-size: 14px;
        color: var(--slate);
        border-bottom: 1px solid var(--border);
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: rgba(10, 124, 124, 0.02);
      }

      .pt-cell {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .pt-av {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        color: white;
        flex-shrink: 0;
      }
      .pt-name {
        font-weight: 600;
        color: var(--navy);
      }
      .pt-code {
        font-size: 11px;
        color: var(--muted);
      }

      .badge {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge.active {
        background: rgba(26, 171, 109, 0.1);
        color: var(--success);
      }
      .badge.admitted {
        background: rgba(10, 124, 124, 0.1);
        color: var(--teal);
      }
      .badge.discharged {
        background: rgba(107, 143, 163, 0.1);
        color: var(--muted);
      }
      .badge.critical {
        background: rgba(224, 82, 82, 0.1);
        color: var(--danger);
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
      }
      .empty-state-icon {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.5;
      }
      .empty-state-title {
        font-family: "Sora", sans-serif;
        font-size: 18px;
        font-weight: 600;
        color: var(--navy);
        margin-bottom: 8px;
      }
    
</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/doctor-patients/main.jsx"></script>
  </body>
</html>
